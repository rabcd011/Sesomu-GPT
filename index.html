```html
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SESOMU GPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;

      background:
        radial-gradient(circle at center, #172554, #020617 70%);
    }

    .container {
      width: 90%;
      max-width: 850px;
      text-align: center;
    }

    h1 {
      font-size: 64px;
      margin: 0;

      letter-spacing: 4px;

      background: linear-gradient(
        90deg,
        #22d3ee,
        #a78bfa,
        #22d3ee
      );

      background-size: 200%;

      color: transparent;
      background-clip: text;
      -webkit-background-clip: text;
    }

    .subtitle {
      color: #94a3b8;
      letter-spacing: 2px;
      margin-top: 15px;
    }

    .logo {
      width: 130px;
      height: 130px;

      margin: 35px auto;

      display: block;

      border-radius: 50%;

      object-fit: contain;

      border: 2px solid #22d3ee;

      box-shadow:
        0 0 20px #22d3ee,
        0 0 45px rgba(34, 211, 238, 0.35);

      background: #071329;
    }

    .search {
      display: flex;

      padding: 8px;

      border: 1px solid #22d3ee;

      border-radius: 20px;

      background: rgba(0, 0, 0, 0.35);

      box-shadow:
        0 0 25px rgba(34, 211, 238, 0.2);
    }

    input {
      flex: 1;

      border: none;
      outline: none;

      background: transparent;

      color: white;

      font-size: 17px;

      padding: 16px;
    }

    input::placeholder {
      color: #64748b;
    }

    button {
      border: none;

      border-radius: 14px;

      padding: 0 25px;

      font-weight: bold;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #22d3ee,
          #a78bfa
        );

      color: #020617;
    }

    button:hover {
      transform: scale(1.03);
    }

    @media (max-width: 600px) {

      h1 {
        font-size: 42px;
      }

      .search {
        flex-direction: column;
        gap: 8px;
      }

      button {
        height: 48px;
      }

    }

</head>
