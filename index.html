<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SESOMU GPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      color: white;
      overflow: hidden;

      background:
        radial-gradient(circle at 50% 25%, #172554 0%, transparent 35%),
        radial-gradient(circle at 15% 80%, #24104d 0%, transparent 35%),
        radial-gradient(circle at 85% 75%, #003d4d 0%, transparent 35%),
        #020617;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;

      background-image:
        linear-gradient(rgba(34, 211, 238, 0.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(34, 211, 238, 0.055) 1px, transparent 1px);

      background-size: 50px 50px;

      mask-image: linear-gradient(
        to bottom,
        transparent,
        black 25%,
        black 75%,
        transparent
      );

      pointer-events: none;
    }

    .particle {
      position: fixed;
      width: 4px;
      height: 4px;
      border-radius: 50%;

      background: #22d3ee;

      box-shadow:
        0 0 12px #22d3ee,
        0 0 25px #22d3ee;

      opacity: 0.7;

      animation: float 8s infinite ease-in-out;

      pointer-events: none;
    }

    .p1 {
      top: 15%;
      left: 12%;
    }

    .p2 {
      top: 30%;
      left: 88%;
      animation-delay: 2s;
    }

    .p3 {
      top: 75%;
      left: 15%;
      animation-delay: 4s;
    }

    .p4 {
      top: 65%;
      left: 82%;
      animation-delay: 1s;
    }

    .p5 {
      top: 12%;
      left: 70%;
      animation-delay: 3s;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0) scale(1);
      }

      50% {
        transform: translateY(-30px) scale(1.5);
      }
    }

    /* Main layout */

    .container {
      position: relative;
      z-index: 2;

      width: 92%;
      max-width: 1000px;

      height: 100vh;

      margin: auto;

      display: flex;
      flex-direction: column;

      align-items: center;

      text-align: center;

      padding-top: 35px;
      padding-bottom: 20px;
    }

    /* Title */

    h1 {
      font-size: clamp(44px, 8vw, 76px);

      margin: 0;

      letter-spacing: 5px;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          #22d3ee,
          #a78bfa,
          #22d3ee,
          #ffffff
        );

      background-size: 300%;

      color: transparent;

      background-clip: text;
      -webkit-background-clip: text;

      animation: titleMove 6s linear infinite;

      text-shadow:
        0 0 30px rgba(34, 211, 238, 0.2);
    }

    @keyframes titleMove {
      0% {
        background-position: 0%;
      }

      100% {
        background-position: 300%;
      }
    }

    .subtitle {
      color: #94a3b8;

      letter-spacing: 3px;

      margin-top: 8px;
      margin-bottom: 0;

      font-size: 14px;

      text-transform: uppercase;
    }

    /* Logo */

    .logo {
      width: 115px;
      height: 115px;

      margin: 18px auto 18px;

      display: block;

      border-radius: 50%;

      object-fit: contain;

      border: 2px solid #22d3ee;

      box-shadow:
        0 0 20px #22d3ee,
        0 0 45px rgba(34, 211, 238, 0.35),
        inset 0 0 25px rgba(34, 211, 238, 0.15);

      background: #071329;

      animation: logoGlow 3s infinite ease-in-out;
    }

    @keyframes logoGlow {
      50% {
        transform: scale(1.04);

        box-shadow:
          0 0 30px #22d3ee,
          0 0 70px rgba(34, 211, 238, 0.35),
          inset 0 0 30px rgba(34, 211, 238, 0.2);
      }
    }

    /* Answer area */

    #chat {
      width: 100%;

      height: 330px;

      flex-shrink: 1;

      overflow-y: auto;

      margin-bottom: 12px;

      padding: 6px 8px;

      scroll-behavior: smooth;

      scrollbar-width: thin;

      scrollbar-color: #22d3ee transparent;
    }

    #chat::-webkit-scrollbar {
      width: 7px;
    }

    #chat::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.03);
      border-radius: 10px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: rgba(34, 211, 238, 0.55);
      border-radius: 10px;
    }

    #chat::-webkit-scrollbar-thumb:hover {
      background: rgba(34, 211, 238, 0.85);
    }

    .message {
      text-align: left;

      padding: 15px 18px;

      margin-bottom: 10px;

      border-radius: 14px;

      line-height: 1.6;

      white-space: pre-wrap;

      word-wrap: break-word;

      overflow-wrap: anywhere;

      backdrop-filter: blur(12px);
    }

    .user {
      background: rgba(34, 211, 238, 0.10);

      border: 1px solid rgba(34, 211, 238, 0.20);
    }

    .bot {
      background: rgba(255, 255, 255, 0.05);

      border: 1px solid rgba(255, 255, 255, 0.10);
    }

    /* Search box */

    .search {
      width: 100%;

      flex-shrink: 0;

      display: flex;

      padding: 8px;

      border: 1px solid rgba(34, 211, 238, 0.65);

      border-radius: 20px;

      background: rgba(0, 0, 0, 0.40);

      backdrop-filter: blur(18px);

      box-shadow:
        0 0 25px rgba(34, 211, 238, 0.20),
        inset 0 0 20px rgba(255, 255, 255, 0.02);

      transition: 0.3s;
    }

    .search:focus-within {
      border-color: #67e8f9;

      box-shadow:
        0 0 35px rgba(34, 211, 238, 0.35),
        0 0 70px rgba(34, 211, 238, 0.08);
    }

    input {
      flex: 1;

      min-width: 0;

      border: none;

      outline: none;

      background: transparent;

      color: white;

      font-size: 17px;

      padding: 16px;
    }

    input::placeholder {
      color: #64748b;
    }

    button {
      border: none;

      border-radius: 14px;

      padding: 0 25px;

      font-weight: bold;

      cursor: pointer;

      background:
        linear-gradient(
          135deg,
          #22d3ee,
          #a78bfa
        );

      color: #020617;

      transition: 0.25s;
    }

    button:hover {
      transform: scale(1.03);

      box-shadow:
        0 0 20px rgba(34, 211, 238, 0.4);
    }

    button:disabled {
      opacity: 0.6;

      cursor: wait;

      transform: none;
    }

    .hint {
      flex-shrink: 0;

      margin-top: 8px;

      color: #475569;

      font-size: 12px;
    }

    /* Mobile */

    @media (max-width: 600px) {

      .container {
        width: 94%;

        padding-top: 20px;
        padding-bottom: 12px;
      }

      h1 {
        font-size: 42px;
        letter-spacing: 3px;
      }

      .subtitle {
        font-size: 11px;
        letter-spacing: 2px;
      }

      .logo {
        width: 100px;
        height: 100px;

        margin: 14px auto 14px;
      }

      #chat {
        height: 300px;

        margin-bottom: 10px;

        padding: 5px 4px;
      }

      .message {
        padding: 13px 15px;

        line-height: 1.55;

        font-size: 15px;
      }

      input {
        font-size: 15px;

        padding: 14px 10px;
      }

      button {
        padding: 0 17px;
      }

      .hint {
        margin-top: 7px;
      }
    }
  </style>
</head>

<body>

  <div class="particle p1"></div>
  <div class="particle p2"></div>
  <div class="particle p3"></div>
  <div class="particle p4"></div>
  <div class="particle p5"></div>

  <div class="container">

    <h1>SESOMU GPT</h1>

    <p class="subtitle">
      Your intelligent AI companion
    </p>

    <img
      class="logo"
      src="logo.jpeg"
      alt="SESOMU GPT logo"
    >

    <div id="chat"></div>

    <div class="search">

      <input
        id="messageInput"
        type="text"
        placeholder="Ask SESOMU GPT anything..."
        autocomplete="off"
      >

      <button id="sendButton">
        Send
      </button>

    </div>

    <div class="hint">
      Made with ❤️ by RG
    </div>

  </div>

  <script>

    const input =
      document.getElementById("messageInput");

    const button =
      document.getElementById("sendButton");

    const chat =
      document.getElementById("chat");

    const WORKER_URL =
      "https://sesomu-gpt-api.ghanu-bhai01.workers.dev/";

    async function sendMessage() {

      const message =
        input.value.trim();

      if (!message) {
        return;
      }

      const userMessage =
        document.createElement("div");

      userMessage.className =
        "message user";

      userMessage.textContent =
        message;

      chat.appendChild(userMessage);

      input.value = "";

      button.disabled = true;

      button.textContent =
        "Thinking...";

      const botMessage =
        document.createElement("div");

      botMessage.className =
        "message bot";

      botMessage.textContent =
        "SESOMU GPT is thinking...";

      chat.appendChild(botMessage);

      chat.scrollTop =
        chat.scrollHeight;

      try {

        const response =
          await fetch(WORKER_URL, {

            method: "POST",

            headers: {
              "Content-Type": "application/json"
            },

            body: JSON.stringify({
              message: message
            })

          });

        const data =
          await response.json();

        if (!response.ok) {

          throw new Error(
            data.error ||
            "Request failed."
          );

        }

        botMessage.textContent =
          data.answer ||
          "I couldn't generate a response.";

      } catch (error) {

        console.error(error);

        botMessage.textContent =
          "Sorry, something went wrong: " +
          error.message;

      }

      button.disabled = false;

      button.textContent =
        "Send";

      chat.scrollTop =
        chat.scrollHeight;

    }

    button.addEventListener(
      "click",
      sendMessage
    );

    input.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          sendMessage();
        }

      }
    );

  </script>

</body>
</html>
