<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SESOMU GPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background: #090914;
      color: #f2f2f7;
    }

    body {
      overflow: hidden;
    }

    button,
    input,
    textarea {
      font: inherit;
    }

    /* =========================================================
       LOGIN
       ========================================================= */

    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, #17172d 0%, #090914 55%);
      z-index: 1000;
    }

    .loginCard {
      width: min(92%, 420px);
      padding: 35px 28px;
      border: 1px solid #2c2c46;
      border-radius: 22px;
      background: #11111f;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45);
      text-align: center;
    }

    .loginLogo {
      width: 92px;
      height: 92px;
      object-fit: contain;
      border-radius: 18px;
      margin-bottom: 15px;
    }

    .loginTitle {
      margin: 0;
      font-size: 30px;
      font-weight: 800;
    }

    .loginSubtitle {
      margin: 8px 0 25px;
      color: #9999b5;
    }

    .loginInput {
      width: 100%;
      height: 46px;
      margin-bottom: 12px;
      padding: 0 14px;
      border: 1px solid #30304b;
      border-radius: 12px;
      outline: none;
      background: #0b0b17;
      color: white;
    }

    .loginInput:focus {
      border-color: #7777ff;
    }

    #loginButton {
      width: 100%;
      height: 46px;
      border: 0;
      border-radius: 12px;
      background: #6666ff;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================================================
       APP
       ========================================================= */

    #app {
      display: none;
      width: 100%;
      height: 100%;
      flex-direction: column;
    }

    .topBar {
      height: 62px;
      flex: 0 0 62px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      border-bottom: 1px solid #25253a;
      background: #0d0d19;
    }

    .brandSmall {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: 0.4px;
    }

    .topActions {
      display: flex;
      gap: 8px;
    }

    .smallButton {
      height: 36px;
      padding: 0 12px;
      border: 1px solid #30304a;
      border-radius: 10px;
      background: #131323;
      color: #dcdced;
      cursor: pointer;
    }

    .smallButton:hover {
      background: #1b1b30;
    }

    /* =========================================================
       CHAT AREA
       ========================================================= */

    .chatArea {
      position: relative;
      flex: 1;
      min-height: 0;
      overflow: hidden;
    }

    #chatMessages {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      padding: 28px 20px 145px;
      scroll-behavior: smooth;
    }

    .welcomeArea {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      padding-bottom: 70px;
    }

    .logoWrap {
      width: 100px;
      height: 100px;
      transition: all 0.25s ease;
    }

    .logoWrap.chatStarted {
      display: none;
    }

    .mainLogo {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 22px;
    }

    .welcomeTitle {
      margin-top: 18px;
      font-size: 27px;
      font-weight: 800;
    }

    .welcomeText {
      margin-top: 8px;
      color: #9696ad;
      text-align: center;
    }

    /* =========================================================
       MESSAGES
       ========================================================= */

    .messageRow {
      display: flex;
      width: 100%;
      margin: 0 0 18px;
    }

    .messageRow.user {
      justify-content: flex-end;
    }

    .messageRow.bot {
      justify-content: flex-start;
    }

    .messageBubble {
      max-width: min(820px, 82%);
      padding: 13px 16px;
      border-radius: 16px;
      line-height: 1.55;

      /*
       * IMPORTANT FIX:
       * Prevent individual characters/words from being
       * forced into separate vertical lines.
       */
      white-space: normal;
      overflow-wrap: break-word;
      word-break: normal;
      overflow: visible;
      writing-mode: horizontal-tb;
      text-orientation: mixed;
    }

    .messageRow.user .messageBubble {
      background: #29294b;
      border-bottom-right-radius: 5px;
    }

    .messageRow.bot .messageBubble {
      background: #151525;
      border: 1px solid #25253c;
      border-bottom-left-radius: 5px;
    }

    /* =========================================================
       MARKDOWN
       ========================================================= */

    .messageBubble p {
      margin: 0 0 10px;
    }

    .messageBubble p:last-child {
      margin-bottom: 0;
    }

    .messageBubble h1,
    .messageBubble h2,
    .messageBubble h3 {
      margin: 10px 0 8px;
      line-height: 1.3;
    }

    .messageBubble ul,
    .messageBubble ol {
      margin: 8px 0 10px;
      padding-left: 24px;
    }

    .messageBubble li {
      margin: 4px 0;
    }

    .messageBubble strong {
      font-weight: 700;
    }

    .messageBubble em {
      font-style: italic;
    }

    .messageBubble code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #090910;
      font-family: Consolas, monospace;
      font-size: 0.92em;
    }

    .messageBubble pre {
      margin: 10px 0;
      padding: 12px;
      max-width: 100%;
      overflow-x: auto;
      border-radius: 10px;
      background: #090910;
    }

    .messageBubble pre code {
      padding: 0;
      background: transparent;
      white-space: pre;
    }

    /* =========================================================
       TYPING
       ========================================================= */

    .typingDots {
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }

    .typingDots span {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #9999bb;
      animation: typing 1s infinite ease-in-out;
    }

    .typingDots span:nth-child(2) {
      animation-delay: 0.15s;
    }

    .typingDots span:nth-child(3) {
      animation-delay: 0.3s;
    }

    @keyframes typing {
      0%,
      60%,
      100% {
        opacity: 0.3;
        transform: translateY(0);
      }

      30% {
        opacity: 1;
        transform: translateY(-3px);
      }
    }

    /* =========================================================
       INPUT
       ========================================================= */

    .inputArea {
      position: absolute;
      left: 50%;
      bottom: 18px;
      transform: translateX(-50%);
      width: min(900px, calc(100% - 28px));
      z-index: 20;
    }

    .inputBox {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px;
      border: 1px solid #30304b;
      border-radius: 16px;
      background: #11111f;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      height: 42px;
      padding: 0 10px;
      border: 0;
      outline: none;
      background: transparent;
      color: white;
      resize: none;
    }

    #messageInput::placeholder {
      color: #77778e;
    }

    .actionButton {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 12px;
      border: 1px solid #30304c;
      background: #111121;
      color: #ddddee;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .actionButton:hover {
      background: #1b1b30;
    }

    .actionButton.active {
      border-color: #7777ff;
      background: #242449;
    }

    .actionButton:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .webButton {
      width: 52px;
      flex-basis: 52px;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 0.5px;
    }

    .micIcon {
      width: 20px;
      height: 25px;
    }

    .micBody,
    .micLine,
    .micBase {
      fill: none;
      stroke: currentColor;
      stroke-width: 2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .micBase {
      fill: currentColor;
      stroke: none;
    }

    #sendButton {
      height: 42px;
      padding: 0 17px;
      border: 0;
      border-radius: 12px;
      background: #6666ff;
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    #sendButton:hover {
      background: #7575ff;
    }

    /* =========================================================
       RECENT CHATS
       ========================================================= */

    #recentPanel {
      position: fixed;
      top: 70px;
      right: 16px;
      width: min(360px, calc(100% - 32px));
      max-height: 70vh;
      overflow-y: auto;
      display: none;
      padding: 14px;
      border: 1px solid #30304b;
      border-radius: 14px;
      background: #11111f;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      z-index: 100;
    }

    .recentTitle {
      font-weight: 700;
      margin-bottom: 10px;
    }

    .recentItem {
      padding: 10px;
      margin-bottom: 7px;
      border-radius: 9px;
      background: #171727;
      cursor: pointer;
      color: #d7d7e7;
    }

    .recentItem:hover {
      background: #202039;
    }

    /* =========================================================
       MOBILE
       ========================================================= */

    @media (max-width: 650px) {
      .topBar {
        padding: 0 10px;
      }

      .brandSmall {
        font-size: 15px;
      }

      .smallButton {
        padding: 0 9px;
        font-size: 12px;
      }

      #chatMessages {
        padding-left: 10px;
        padding-right: 10px;
        padding-bottom: 130px;
      }

      .messageBubble {
        max-width: 92%;
        font-size: 14px;

        /*
         * Keep horizontal writing on mobile too.
         */
        writing-mode: horizontal-tb;
        word-break: normal;
        overflow-wrap: break-word;
      }

      .inputArea {
        width: calc(100% - 14px);
        bottom: 8px;
      }

      .inputBox {
        gap: 5px;
        padding: 6px;
      }

      .actionButton {
        width: 39px;
        height: 39px;
        flex-basis: 39px;
      }

      .webButton {
        width: 48px;
        flex-basis: 48px;
        font-size: 10px;
      }

      #sendButton {
        height: 39px;
        padding: 0 12px;
        font-size: 13px;
      }

      #messageInput {
        height: 39px;
        font-size: 14px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================================================
       LOGIN
       ========================================================= -->

  <div id="loginScreen">
    <div class="loginCard">

      <img
        src="logo.jpeg"
        alt="SESOMU"
        class="loginLogo"
      >

      <h1 class="loginTitle">
        SESOMU GPT
      </h1>

      <p class="loginSubtitle">
        Your intelligent AI companion
      </p>

      <input
        id="nameInput"
        class="loginInput"
        type="text"
        placeholder="Enter your name"
      >

      <input
        id="designationInput"
        class="loginInput"
        type="text"
        placeholder="Enter your designation"
      >

      <button id="loginButton">
        Continue
      </button>

    </div>
  </div>


  <!-- =========================================================
       APPLICATION
       ========================================================= -->

  <div id="app">

    <div class="topBar">

      <div class="brandSmall">
        SESOMU GPT
      </div>

      <div class="topActions">

        <button
          class="smallButton"
          id="newChatButton"
        >
          + New Chat
        </button>

        <button
          class="smallButton"
          id="recentButton"
        >
          Recent Chats
        </button>

      </div>

    </div>


    <div class="chatArea">

      <div
        id="chatMessages"
      ></div>


      <div
        class="welcomeArea"
        id="welcomeArea"
      >

        <div
          class="logoWrap"
          id="logoWrap"
        >
          <img
            src="logo.jpeg"
            alt="SESOMU"
            class="mainLogo"
          >
        </div>

        <div class="welcomeTitle">
          SESOMU GPT
        </div>

        <div class="welcomeText">
          Ask anything...
        </div>

      </div>


      <!-- =====================================================
           INPUT
           ===================================================== -->

      <div class="inputArea">

        <div class="inputBox">

          <input
            id="messageInput"
            type="text"
            placeholder="Ask anything..."
            autocomplete="off"
          >


          <!-- WEB BUTTON -->

          <button
            id="grokButton"
            class="actionButton webButton"
            title="Real-time Web Search"
            aria-label="Real-time Web Search"
          >
            WEB
          </button>


          <!-- MICROPHONE -->

          <button
            id="micButton"
            class="actionButton micButton"
            title="Voice input"
            aria-label="Voice input"
          >

            <svg
              class="micIcon"
              viewBox="0 0 32 40"
              aria-hidden="true"
            >

              <rect
                class="micBody"
                x="9"
                y="2"
                width="14"
                height="23"
                rx="7"
              />

              <path
                class="micLine"
                d="M11.5 9h9"
              />

              <path
                class="micLine"
                d="M11.5 13h9"
              />

              <path
                class="micLine"
                d="M11.5 17h9"
              />

              <path
                class="micLine"
                d="M5 18v2a11 11 0 0 0 22 0v-2"
              />

              <path
                class="micLine"
                d="M16 31V25"
              />

              <rect
                class="micBase"
                x="9"
                y="31"
                width="14"
                height="3"
                rx="1.5"
              />

            </svg>

          </button>


          <button id="sendButton">
            Send
          </button>

        </div>

      </div>

    </div>

  </div>


  <!-- =========================================================
       RECENT CHATS PANEL
       ========================================================= -->

  <div id="recentPanel">
    <div class="recentTitle">
      Recent Chats
    </div>

    <div id="recentList"></div>
  </div>


  <script>

    /* ==========================================================
       API
       ========================================================== */

    const API_URL =
      "https://sesomu-gpt-api.ghanu-bhai01.workers.dev/";


    /* ==========================================================
       ELEMENTS
       ========================================================== */

    const loginScreen =
      document.getElementById("loginScreen");

    const app =
      document.getElementById("app");

    const nameInput =
      document.getElementById("nameInput");

    const designationInput =
      document.getElementById("designationInput");

    const loginButton =
      document.getElementById("loginButton");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const grokButton =
      document.getElementById("grokButton");

    const micButton =
      document.getElementById("micButton");

    const newChatButton =
      document.getElementById("newChatButton");

    const recentButton =
      document.getElementById("recentButton");

    const recentPanel =
      document.getElementById("recentPanel");

    const recentList =
      document.getElementById("recentList");

    const chatMessages =
      document.getElementById("chatMessages");

    const logoWrap =
      document.getElementById("logoWrap");

    const welcomeArea =
      document.getElementById("welcomeArea");


    /* ==========================================================
       USER LOGIN
       ========================================================== */

    function showApp() {
      loginScreen.style.display = "none";
      app.style.display = "flex";
      messageInput.focus();
    }


    function showLogin() {
      loginScreen.style.display = "flex";
      app.style.display = "none";
    }


    loginButton.addEventListener(
      "click",
      () => {

        const name =
          nameInput.value.trim();

        const designation =
          designationInput.value.trim();

        if (!name) {
          nameInput.focus();
          return;
        }

        const user = {
          name,
          designation
        };

        localStorage.setItem(
          "sesomu_user",
          JSON.stringify(user)
        );

        showApp();
      }
    );


    nameInput.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          designationInput.focus();
        }
      }
    );


    designationInput.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          loginButton.click();
        }
      }
    );


    const savedUser =
      localStorage.getItem("sesomu_user");

    if (savedUser) {
      showApp();
    } else {
      showLogin();
    }


    /* ==========================================================
       HTML ESCAPE
       ========================================================== */

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* ==========================================================
       MARKDOWN
       ========================================================== */

    function renderMarkdown(text) {

      let source =
        escapeHTML(text || "");


      /*
       * Protect code blocks.
       */

      const codeBlocks = [];

      source = source.replace(
        /```([\s\S]*?)```/g,
        function(match, code) {

          const index =
            codeBlocks.length;

          codeBlocks.push(
            "<pre><code>" +
            code.trim() +
            "</code></pre>"
          );

          return `@@CODEBLOCK${index}@@`;
        }
      );


      /*
       * Inline code.
       */

      source = source.replace(
        /`([^`\n]+)`/g,
        "<code>$1</code>"
      );


      /*
       * Headings.
       */

      source = source.replace(
        /^### (.*)$/gm,
        "<h3>$1</h3>"
      );

      source = source.replace(
        /^## (.*)$/gm,
        "<h2>$1</h2>"
      );

      source = source.replace(
        /^# (.*)$/gm,
        "<h1>$1</h1>"
      );


      /*
       * Bold.
       */

      source = source.replace(
        /\*\*(.*?)\*\*/g,
        "<strong>$1</strong>"
      );

      source = source.replace(
        /__(.*?)__/g,
        "<strong>$1</strong>"
      );


      /*
       * Italic.
       */

      source = source.replace(
        /(?<!\*)\*([^*\n]+)\*(?!\*)/g,
        "<em>$1</em>"
      );

      source = source.replace(
        /(?<!_)_([^_\n]+)_(?!_)/g,
        "<em>$1</em>"
      );


      /*
       * Lists.
       */

      const lines =
        source.split("\n");

      let html = "";
      let inUL = false;
      let inOL = false;

      function closeLists() {

        if (inUL) {
          html += "</ul>";
          inUL = false;
        }

        if (inOL) {
          html += "</ol>";
          inOL = false;
        }
      }


      for (let i = 0; i < lines.length; i++) {

        const line =
          lines[i];

        const unordered =
          line.match(/^\s*[-*]\s+(.*)$/);

        const ordered =
          line.match(/^\s*\d+\.\s+(.*)$/);


        if (unordered) {

          if (inOL) {
            html += "</ol>";
            inOL = false;
          }

          if (!inUL) {
            html += "<ul>";
            inUL = true;
          }

          html +=
            "<li>" +
            unordered[1] +
            "</li>";

          continue;
        }


        if (ordered) {

          if (inUL) {
            html += "</ul>";
            inUL = false;
          }

          if (!inOL) {
            html += "<ol>";
            inOL = true;
          }

          html +=
            "<li>" +
            ordered[1] +
            "</li>";

          continue;
        }


        closeLists();


        if (!line.trim()) {
          html += "<br>";
        } else {
          html +=
            "<p>" +
            line +
            "</p>";
        }
      }


      closeLists();


      /*
       * Restore code blocks.
       */

      html =
        html.replace(
          /@@CODEBLOCK(\d+)@@/g,
          function(match, index) {
            return codeBlocks[
              Number(index)
            ];
          }
        );


      /*
       * Remove excessive empty paragraphs.
       */

      html =
        html.replace(
          /<p><br><\/p>/g,
          "<br>"
        );


      return html;
    }


    /* ==========================================================
       ADD USER MESSAGE
       ========================================================== */

    function addUserMessage(text) {

      const row =
        document.createElement("div");

      row.className =
        "messageRow user";


      const bubble =
        document.createElement("div");

      bubble.className =
        "messageBubble";


      /*
       * User messages use textContent.
       * This prevents HTML injection.
       */

      bubble.textContent =
        text;


      row.appendChild(bubble);

      chatMessages.appendChild(row);

      scrollToBottom();
    }


    /* ==========================================================
       ADD BOT MESSAGE
       ========================================================== */

    function addBotMessage(text) {

      const row =
        document.createElement("div");

      row.className =
        "messageRow bot";


      const bubble =
        document.createElement("div");

      bubble.className =
        "messageBubble";


      /*
       * IMPORTANT:
       * Markdown is rendered as horizontal HTML.
       */

      bubble.innerHTML =
        renderMarkdown(text);


      row.appendChild(bubble);

      chatMessages.appendChild(row);

      scrollToBottom();
    }


    /* ==========================================================
       TYPING
       ========================================================== */

    function addTypingMessage() {

      const row =
        document.createElement("div");

      row.className =
        "messageRow bot";


      const bubble =
        document.createElement("div");

      bubble.className =
        "messageBubble";


      bubble.innerHTML = `
        <span class="typingDots">
          <span></span>
          <span></span>
          <span></span>
        </span>
      `;


      row.appendChild(bubble);

      chatMessages.appendChild(row);

      scrollToBottom();

      return row;
    }


    /* ==========================================================
       SCROLL
       ========================================================== */

    function scrollToBottom() {

      requestAnimationFrame(() => {

        chatMessages.scrollTop =
          chatMessages.scrollHeight;

      });
    }


    /* ==========================================================
       SAVE CHAT
       ========================================================== */

    function saveCurrentChat() {

      const rows =
        Array.from(
          chatMessages.querySelectorAll(
            ".messageRow"
          )
        );

      if (!rows.length) {
        return;
      }

      const messages =
        rows.map(row => {

          const bubble =
            row.querySelector(
              ".messageBubble"
            );

          return {
            role:
              row.classList.contains("user")
                ? "user"
                : "assistant",

            text:
              bubble
                ? bubble.innerText
                : ""
          };
        });


      const chats =
        JSON.parse(
          localStorage.getItem(
            "sesomu_recent_chats"
          ) || "[]"
        );


      chats.unshift({
        date:
          new Date().toLocaleString(),

        messages
      });


      /*
       * Keep last 20 chats.
       */

      const limited =
        chats.slice(0, 20);


      localStorage.setItem(
        "sesomu_recent_chats",
        JSON.stringify(limited)
      );
    }


    /* ==========================================================
       NORMAL CHAT
       ========================================================== */

    async function askAI() {

      const message =
        messageInput.value.trim();

      if (!message) {
        messageInput.focus();
        return;
      }


      addUserMessage(message);

      logoWrap.classList.add(
        "chatStarted"
      );

      welcomeArea.style.display =
        "none";

      messageInput.value = "";


      const typing =
        addTypingMessage();


      sendButton.disabled =
        true;

      grokButton.disabled =
        true;


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  message
                })
            }
          );


        const data =
          await response.json();


        typing.remove();


        if (!response.ok) {

          addBotMessage(
            data?.answer ||
            "The AI service is unavailable right now."
          );

          return;
        }


        addBotMessage(
          data?.answer ||
          "No answer was returned."
        );


        saveCurrentChat();

      } catch (error) {

        typing.remove();

        addBotMessage(
          "Unable to connect to SESOMU GPT."
        );

      } finally {

        sendButton.disabled =
          false;

        grokButton.disabled =
          false;

        messageInput.focus();
      }
    }


    /* ==========================================================
       WEB / GROK
       ========================================================== */

    async function askGrok() {

      const message =
        messageInput.value.trim();

      if (!message) {
        messageInput.focus();
        return;
      }


      addUserMessage(message);

      logoWrap.classList.add(
        "chatStarted"
      );

      welcomeArea.style.display =
        "none";

      messageInput.value = "";


      const typing =
        addTypingMessage();


      grokButton.disabled =
        true;

      grokButton.classList.add(
        "active"
      );


      try {

        const response =
          await fetch(
            API_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  message,
                  mode: "grok"
                })
            }
          );


        const data =
          await response.json();


        typing.remove();


        if (!response.ok) {

          addBotMessage(
            data?.answer ||
            "WEB search is unavailable right now."
          );

          return;
        }


        addBotMessage(
          data?.answer ||
          "WEB search did not return an answer."
        );


        saveCurrentChat();

      } catch (error) {

        typing.remove();

        addBotMessage(
          "Unable to connect to WEB search."
        );

      } finally {

        grokButton.disabled =
          false;

        grokButton.classList.remove(
          "active"
        );

        messageInput.focus();
      }
    }


    /* ==========================================================
       BUTTON EVENTS
       ========================================================== */

    sendButton.addEventListener(
      "click",
      askAI
    );


    grokButton.addEventListener(
      "click",
      askGrok
    );


    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          askAI();
        }
      }
    );


    /* ==========================================================
       NEW CHAT
       ========================================================== */

    newChatButton.addEventListener(
      "click",
      () => {

        if (
          chatMessages.children.length
        ) {
          saveCurrentChat();
        }


        chatMessages.innerHTML = "";

        logoWrap.classList.remove(
          "chatStarted"
        );

        welcomeArea.style.display =
          "flex";

        recentPanel.style.display =
          "none";

        messageInput.value = "";

        messageInput.focus();
      }
    );


    /* ==========================================================
       RECENT CHATS
       ========================================================== */

    function loadRecentChats() {

      const chats =
        JSON.parse(
          localStorage.getItem(
            "sesomu_recent_chats"
          ) || "[]"
        );


      recentList.innerHTML = "";


      if (!chats.length) {

        recentList.innerHTML =
          "<div>No recent chats.</div>";

        return;
      }


      chats.forEach(
        (chat, index) => {

          const item =
            document.createElement(
              "div"
            );

          item.className =
            "recentItem";


          const firstUserMessage =
            chat.messages.find(
              message =>
                message.role === "user"
            );


          item.textContent =
            firstUserMessage?.text ||
            "Chat " + (index + 1);


          item.addEventListener(
            "click",
            () => {

              chatMessages.innerHTML =
                "";

              logoWrap.classList.add(
                "chatStarted"
              );

              welcomeArea.style.display =
                "none";


              chat.messages.forEach(
                message => {

                  if (
                    message.role === "user"
                  ) {
                    addUserMessage(
                      message.text
                    );
                  } else {
                    addBotMessage(
                      message.text
                    );
                  }

                }
              );


              recentPanel.style.display =
                "none";

              scrollToBottom();
            }
          );


          recentList.appendChild(item);
        }
      );
    }


    recentButton.addEventListener(
      "click",
      () => {

        if (
          recentPanel.style.display ===
          "block"
        ) {

          recentPanel.style.display =
            "none";

        } else {

          loadRecentChats();

          recentPanel.style.display =
            "block";
        }
      }
    );


    /* ==========================================================
       MICROPHONE
       ========================================================== */

    let recognition = null;


    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    if (SpeechRecognition) {

      recognition =
        new SpeechRecognition();

      recognition.continuous =
        false;

      recognition.interimResults =
        false;

      recognition.lang =
        "en-IN";


      recognition.onstart =
        () => {

          micButton.classList.add(
            "active"
          );
        };


      recognition.onend =
        () => {

          micButton.classList.remove(
            "active"
          );
        };


      recognition.onerror =
        () => {

          micButton.classList.remove(
            "active"
          );
        };


      recognition.onresult =
        event => {

          const transcript =
            event.results[0][0].transcript;

          messageInput.value =
            transcript;

          messageInput.focus();
        };


      micButton.addEventListener(
        "click",
        () => {

          try {
            recognition.start();
          } catch (error) {
            // Ignore repeated start errors.
          }

        }
      );

    } else {

      micButton.addEventListener(
        "click",
        () => {

          addBotMessage(
            "Voice input is not supported by this browser."
          );

        }
      );

    }


    /* ==========================================================
       CLOSE RECENT PANEL WHEN CLICKING OUTSIDE
       ========================================================== */

    document.addEventListener(
      "click",
      event => {

        if (
          !recentPanel.contains(
            event.target
          ) &&
          !recentButton.contains(
            event.target
          )
        ) {

          recentPanel.style.display =
            "none";
        }
      }
    );

  </script>

</body>
</html>
