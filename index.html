<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>SESOMU GPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, #15152f 0%, #080812 45%, #030307 100%);
      color: white;
    }

    body {
      min-height: 100dvh;
    }

    button,
    input {
      font: inherit;
    }

    /* =========================
       LOGIN
    ========================= */

    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background:
        radial-gradient(circle at center, #17173a 0%, #07070f 65%, #020204 100%);
      z-index: 100;
    }

    .loginBox {
      width: min(420px, 100%);
      padding: 32px 25px;
      border: 1px solid rgba(0, 220, 255, 0.25);
      border-radius: 24px;
      background: rgba(12, 12, 28, 0.88);
      box-shadow:
        0 0 35px rgba(0, 200, 255, 0.08),
        0 20px 60px rgba(0, 0, 0, 0.5);
      text-align: center;
      backdrop-filter: blur(18px);
    }

    .loginLogo {
      width: 95px;
      height: 95px;
      object-fit: contain;
      border-radius: 20px;
      margin-bottom: 15px;
    }

    .loginBox h2 {
      margin: 0 0 7px;
      font-size: 27px;
    }

    .loginBox p {
      margin: 0 0 25px;
      color: #aaaac4;
      font-size: 14px;
    }

    .loginInput {
      width: 100%;
      height: 50px;
      margin-bottom: 12px;
      padding: 0 16px;
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 14px;
      outline: none;
      background: rgba(255,255,255,0.06);
      color: white;
    }

    .loginInput::placeholder {
      color: #77778e;
    }

    .loginInput:focus {
      border-color: #00d9ff;
      box-shadow: 0 0 15px rgba(0,217,255,0.12);
    }

    #loginButton {
      width: 100%;
      height: 50px;
      margin-top: 7px;
      border: 0;
      border-radius: 14px;
      background: linear-gradient(90deg, #00cfff, #786cff);
      color: white;
      font-weight: bold;
      cursor: pointer;
    }

    /* =========================
       MAIN APP
    ========================= */

    #app {
      display: none;
      position: relative;
      width: 100%;
      height: 100dvh;
      overflow: hidden;
    }

    /* =========================
       TOP BAR
    ========================= */

    .topBar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      z-index: 30;

      display: flex;
      justify-content: space-between;
      align-items: center;

      padding:
        max(12px, env(safe-area-inset-top))
        18px
        12px;

      background: linear-gradient(
        to bottom,
        rgba(3,3,10,0.96),
        rgba(3,3,10,0.72),
        transparent
      );
    }

    .topButtons {
      display: flex;
      gap: 8px;
    }

    .smallButton {
      height: 36px;
      padding: 0 13px;
      border: 1px solid rgba(0, 220, 255, 0.25);
      border-radius: 10px;
      background: rgba(12, 15, 30, 0.82);
      color: #d8faff;
      font-size: 12px;
      cursor: pointer;
      backdrop-filter: blur(12px);
    }

    .smallButton:hover {
      border-color: #00d9ff;
      background: rgba(0, 217, 255, 0.1);
    }

    /* =========================
       FIXED SESOMU HEADER
    ========================= */

    .logoWrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -55%);

      z-index: 15;

      display: flex;
      flex-direction: column;
      align-items: center;

      width: 100%;

      transition:
        top 0.45s ease,
        transform 0.45s ease;

      pointer-events: none;
    }

    /*
      Once chat starts, this becomes a fixed header.
      The chat area begins below it.
    */

    .logoWrap.chatStarted {
      top: 58px;
      transform: translateX(-50%);
    }

    .logo {
      width: 90px;
      height: 90px;
      object-fit: contain;
      border-radius: 20px;
      filter: drop-shadow(0 0 20px rgba(0,210,255,0.15));
    }

    .title {
      margin-top: 6px;
      font-size: 27px;
      font-weight: 700;
      letter-spacing: 1px;

      background: linear-gradient(
        90deg,
        #00eaff,
        #9d7cff
      );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      margin-top: 4px;
      color: #8888a4;
      font-size: 12px;
    }

    /*
      Header background layer.
      This prevents scrolling messages from visually
      showing behind the logo/header.
    */

    .logoWrap.chatStarted::before {
      content: "";

      position: absolute;

      left: 50%;
      top: -18px;

      width: 100vw;
      height: 145px;

      transform: translateX(-50%);

      background:
        linear-gradient(
          to bottom,
          rgba(5,5,14,0.99) 0%,
          rgba(5,5,14,0.97) 72%,
          rgba(5,5,14,0.72) 90%,
          rgba(5,5,14,0) 100%
        );

      z-index: -1;

      pointer-events: none;
    }

    /* =========================
       CHAT
    ========================= */

    #chat {
      position: absolute;

      /*
        IMPORTANT:
        Chat begins below the fixed SESOMU GPT header.
      */

      top: 165px;
      bottom: 112px;

      left: 50%;
      transform: translateX(-50%);

      width: min(900px, calc(100% - 40px));

      padding:
        15px 5px 20px;

      overflow-y: auto;
      overscroll-behavior: contain;

      scrollbar-width: thin;
      scrollbar-color: #30304c transparent;

      z-index: 5;
    }

    #chat::-webkit-scrollbar {
      width: 5px;
    }

    #chat::-webkit-scrollbar-thumb {
      background: #30304c;
      border-radius: 10px;
    }

    .message {
      max-width: 82%;
      margin-bottom: 15px;
      padding: 13px 16px;
      border-radius: 17px;

      line-height: 1.5;
      font-size: 14px;

      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .userMessage {
      margin-left: auto;

      background:
        linear-gradient(
          135deg,
          #124b68,
          #24305d
        );

      border-bottom-right-radius: 5px;

      box-shadow:
        0 6px 20px rgba(0,0,0,0.18);
    }

    .botMessage {
      margin-right: auto;

      background:
        rgba(255,255,255,0.055);

      border:
        1px solid rgba(255,255,255,0.07);

      border-bottom-left-radius: 5px;
    }

    /* =========================
       INPUT AREA
    ========================= */

    .inputArea {
      position: absolute;

      left: 50%;
      bottom: 0;

      transform: translateX(-50%);

      width: min(900px, calc(100% - 40px));

      padding:
        10px 0
        max(14px, env(safe-area-inset-bottom));

      z-index: 30;
    }

    .inputBox {
      display: flex;
      align-items: center;
      gap: 8px;

      min-height: 58px;
      padding: 7px;

      border:
        1px solid rgba(0, 220, 255, 0.2);

      border-radius: 18px;

      background:
        rgba(10, 10, 23, 0.95);

      box-shadow:
        0 10px 35px rgba(0,0,0,0.45),
        0 0 25px rgba(0,180,255,0.04);

      backdrop-filter: blur(18px);
    }

    .search {
      flex: 1;
      min-width: 0;

      height: 44px;

      padding: 0 13px;

      border: 0;
      outline: none;

      background: transparent;
      color: white;

      font-size: 15px;
    }

    .search::placeholder {
      color: #77778d;
    }

    .actionButton {
      flex: 0 0 auto;

      height: 44px;

      border: 0;
      border-radius: 13px;

      cursor: pointer;

      transition:
        0.2s ease;
    }

    /* =========================
       CYLINDRICAL MICROPHONE
    ========================= */

    .micButton {
      width: 48px;

      display: flex;
      align-items: center;
      justify-content: center;

      background:
        rgba(255,255,255,0.07);

      color: #d7faff;
    }

    .micButton:hover {
      background:
        rgba(0,220,255,0.12);

      color: #00eaff;
    }

    .micButton.listening {
      background:
        rgba(255,70,100,0.16);

      color: #ff6680;

      box-shadow:
        0 0 15px rgba(255,70,100,0.18);
    }

    .micIcon {
      width: 27px;
      height: 34px;
      overflow: visible;
    }

    .micIcon .micBody {
      fill: currentColor;
    }

    .micIcon .micLine {
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
    }

    .micIcon .micBase {
      fill: currentColor;
    }

    #sendButton {
      min-width: 76px;
      padding: 0 17px;

      background:
        linear-gradient(
          135deg,
          #00cfff,
          #7168ff
        );

      color: white;
      font-weight: 600;
    }

    #sendButton:hover {
      transform: translateY(-1px);

      box-shadow:
        0 5px 18px rgba(0,210,255,0.2);
    }

    #sendButton:disabled,
    .micButton:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .hint {
      text-align: center;
      margin-top: 6px;

      color: #5d5d73;
      font-size: 10px;
    }

    /* =========================
       RECENT CHATS
    ========================= */

    #recentPanel {
      position: fixed;

      top: 0;
      right: -390px;

      width: min(370px, 88vw);
      height: 100dvh;

      z-index: 80;

      padding:
        max(60px, calc(env(safe-area-inset-top) + 35px))
        18px 20px;

      background:
        rgba(9, 9, 20, 0.97);

      border-left:
        1px solid rgba(0,220,255,0.16);

      box-shadow:
        -15px 0 45px rgba(0,0,0,0.45);

      transition:
        right 0.3s ease;

      backdrop-filter: blur(20px);
    }

    #recentPanel.open {
      right: 0;
    }

    .recentHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;

      margin-bottom: 18px;
    }

    .recentHeader h3 {
      margin: 0;
      font-size: 19px;
    }

    #closeRecent {
      width: 34px;
      height: 34px;

      border: 0;
      border-radius: 10px;

      background:
        rgba(255,255,255,0.07);

      color: white;

      cursor: pointer;
      font-size: 18px;
    }

    .recentItem {
      padding: 13px;
      margin-bottom: 9px;

      border:
        1px solid rgba(255,255,255,0.07);

      border-radius: 12px;

      background:
        rgba(255,255,255,0.04);

      cursor: pointer;
    }

    .recentItem:hover {
      border-color:
        rgba(0,220,255,0.25);

      background:
        rgba(0,220,255,0.06);
    }

    .recentTitle {
      color: white;
      font-size: 13px;
      font-weight: 600;

      margin-bottom: 4px;

      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .recentDate {
      color: #77778c;
      font-size: 10px;
    }

    .emptyRecent {
      color: #77778c;
      text-align: center;

      margin-top: 50px;

      font-size: 13px;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .topBar {
        padding:
          max(9px, env(safe-area-inset-top))
          10px 8px;

        z-index: 30;
      }

      .topButtons {
        width: 100%;
        justify-content: space-between;
      }

      .smallButton {
        height: 34px;

        padding: 0 10px;

        font-size: 11px;
      }

      /* =====================
         MOBILE HEADER
      ===================== */

      .logoWrap {
        top: 47%;
      }

      .logoWrap.chatStarted {
        top: 48px;

        transform:
          translateX(-50%);
      }

      .logoWrap.chatStarted::before {
        top: -12px;
        height: 128px;
      }

      .logo {
        width: 67px;
        height: 67px;

        border-radius: 16px;
      }

      .title {
        margin-top: 4px;
        font-size: 21px;
      }

      .subtitle {
        margin-top: 2px;
        font-size: 10px;
      }

      /* =====================
         MOBILE CHAT
      ===================== */

      #chat {
        top: 125px;
        bottom: 76px;

        width: 100%;

        padding:
          8px 12px 12px;

        z-index: 5;
      }

      .message {
        max-width: 90%;

        padding:
          11px 13px;

        margin-bottom: 11px;

        font-size: 14px;
        line-height: 1.45;

        border-radius: 15px;
      }

      /* =====================
         MOBILE INPUT
      ===================== */

      .inputArea {
        width: 100%;

        padding:
          7px 9px
          max(9px, env(safe-area-inset-bottom));
      }

      .inputBox {
        min-height: 54px;

        padding: 5px;

        border-radius: 17px;

        gap: 5px;
      }

      .search {
        height: 42px;

        padding: 0 9px;

        font-size: 15px;
      }

      .micButton {
        width: 44px;
        height: 42px;
      }

      .micIcon {
        width: 25px;
        height: 32px;
      }

      #sendButton {
        min-width: 65px;

        height: 42px;

        padding: 0 12px;

        font-size: 13px;
      }

      .hint {
        display: none;
      }

      #recentPanel {
        width: 92vw;
      }
    }

    /* =========================
       VERY SMALL PHONES
    ========================= */

    @media (max-width: 360px) {

      .smallButton {
        font-size: 10px;
        padding: 0 8px;
      }

      .search {
        font-size: 14px;
      }

      #sendButton {
        min-width: 58px;
        padding: 0 9px;
      }

      .micButton {
        width: 41px;
      }

      .logoWrap.chatStarted {
        top: 45px;
      }

      #chat {
        top: 118px;
      }
    }
  </style>

</head>

  </div>

  <script>

    /* =========================
       CONFIGURATION
    ========================= */

    const API_URL =
      "https://sesomu-gpt-api.ghanu-bhai01.workers.dev/";


    /* =========================
       ELEMENTS
    ========================= */

    const loginScreen =
      document.getElementById("loginScreen");

    const app =
      document.getElementById("app");

    const nameInput =
      document.getElementById("nameInput");

    const designationInput =
      document.getElementById("designationInput");

    const loginButton =
      document.getElementById("loginButton");

    const newChatButton =
      document.getElementById("newChatButton");

    const recentButton =
      document.getElementById("recentButton");

    const recentPanel =
      document.getElementById("recentPanel");

    const closeRecent =
      document.getElementById("closeRecent");

    const recentList =
      document.getElementById("recentList");

    const chat =
      document.getElementById("chat");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const micButton =
      document.getElementById("micButton");

    const logoWrap =
      document.getElementById("logoWrap");


    /* =========================
       USER STORAGE
    ========================= */

    function getSavedUser() {

      try {

        return JSON.parse(
          localStorage.getItem(
            "sesomuUser"
          )
        );

      } catch {

        return null;

      }

    }


    function saveUser(user) {

      localStorage.setItem(
        "sesomuUser",
        JSON.stringify(user)
      );

    }


    /* =========================
       CHAT STORAGE
    ========================= */

    function getChats() {

      try {

        return JSON.parse(
          localStorage.getItem(
            "sesomuChats"
          )
        ) || [];

      } catch {

        return [];

      }

    }


    function saveChats(chats) {

      localStorage.setItem(
        "sesomuChats",
        JSON.stringify(chats)
      );

    }


    function saveCurrentChat() {

      if (!chat.children.length) {
        return;
      }


      const messages = [];


      chat.querySelectorAll(".message")
        .forEach(element => {

          messages.push({

            type:
              element.classList.contains(
                "userMessage"
              )
                ? "user"
                : "bot",

            text:
              element.textContent

          });

        });


      if (!messages.length) {
        return;
      }


      const chats =
        getChats();


      chats.unshift({

        id: Date.now(),

        title:
          messages[0].text.substring(
            0,
            55
          ),

        date:
          new Date().toLocaleString(),

        messages

      });


      saveChats(
        chats.slice(0, 20)
      );

    }


    /* =========================
       SHOW APP
    ========================= */

    function showApp() {

      loginScreen.style.display =
        "none";

      app.style.display =
        "block";

      messageInput.focus();

    }


    /* =========================
       LOGIN
    ========================= */

    function login() {

      const name =
        nameInput.value.trim();

      const designation =
        designationInput.value.trim();


      if (!name) {

        nameInput.focus();

        return;

      }


      saveUser({

        name,

        designation

      });


      showApp();

    }


    loginButton.addEventListener(
      "click",
      login
    );


    nameInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          designationInput.focus();

        }

      }
    );


    designationInput.addEventListener(
      "keydown",
      event => {

        if (event.key === "Enter") {

          login();

        }

      }
    );


    /* =========================
       NEW CHAT
    ========================= */

    function startNewChat() {

      saveCurrentChat();

      chat.innerHTML = "";

      logoWrap.classList.remove(
        "chatStarted"
      );

      messageInput.value = "";

      recentPanel.classList.remove(
        "open"
      );

      messageInput.focus();

    }


    newChatButton.addEventListener(
      "click",
      startNewChat
    );


    /* =========================
       RECENT CHATS
    ========================= */

    function showRecentChats() {

      const chats =
        getChats();

      recentList.innerHTML = "";


      if (!chats.length) {

        recentList.innerHTML =
          '<div class="emptyRecent">No recent chats yet.</div>';

      } else {

        chats.forEach(item => {

          const div =
            document.createElement(
              "div"
            );

          div.className =
            "recentItem";


          div.innerHTML = `
            <div class="recentTitle">
              ${escapeHTML(item.title)}
            </div>

            <div class="recentDate">
              ${escapeHTML(item.date)}
            </div>
          `;


          div.addEventListener(
            "click",
            () => loadChat(item)
          );


          recentList.appendChild(
            div
          );

        });

      }


      recentPanel.classList.add(
        "open"
      );

    }


    recentButton.addEventListener(
      "click",
      showRecentChats
    );


    closeRecent.addEventListener(
      "click",
      () => {

        recentPanel.classList.remove(
          "open"
        );

      }
    );


    function loadChat(item) {

      chat.innerHTML = "";


      item.messages.forEach(
        message => {

          if (
            message.type === "user"
          ) {

            addUserMessage(
              message.text
            );

          } else {

            addBotMessage(
              message.text
            );

          }

        }
      );


      logoWrap.classList.add(
        "chatStarted"
      );


      recentPanel.classList.remove(
        "open"
      );


      scrollChat();

    }


    /* =========================
       HTML ESCAPE
    ========================= */

    function escapeHTML(text) {

      const div =
        document.createElement(
          "div"
        );

      div.textContent =
        text;

      return div.innerHTML;

    }


    /* =========================
       ADD USER MESSAGE
    ========================= */

    function addUserMessage(text) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "message userMessage";

      div.textContent =
        text;

      chat.appendChild(div);

    }


    /* =========================
       ADD BOT MESSAGE
    ========================= */

    function addBotMessage(text) {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "message botMessage";

      div.textContent =
        text;

      chat.appendChild(div);

    }


    /* =========================
       SCROLL CHAT
    ========================= */

    function scrollChat() {

      requestAnimationFrame(() => {

        chat.scrollTop =
          chat.scrollHeight;

      });

    }


    /* =========================
       SEND MESSAGE
    ========================= */

    async function sendMessage() {

      const message =
        messageInput.value.trim();


      if (!message) {
        return;
      }


      logoWrap.classList.add(
        "chatStarted"
      );


      addUserMessage(
        message
      );


      messageInput.value = "";

      scrollChat();


      sendButton.disabled = true;

      micButton.disabled = true;


      const thinking =
        document.createElement(
          "div"
        );

      thinking.className =
        "message botMessage";

      thinking.textContent =
        "Thinking...";


      chat.appendChild(
        thinking
      );


      scrollChat();


      try {

        const response =
          await fetch(
            API_URL,
            {

              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body:
                JSON.stringify({
                  message
                })

            }
          );


        let data;


        try {

          data =
            await response.json();

        } catch {

          throw new Error(
            "Invalid server response."
          );

        }


        thinking.remove();


        if (!response.ok) {

          throw new Error(
            data.error ||
            "Server error."
          );

        }


        addBotMessage(
          data.answer ||
          "I could not generate a response."
        );


      } catch (error) {

        thinking.remove();


        addBotMessage(
          "Sorry, I couldn't connect to SESOMU GPT right now. Please try again."
        );


        console.error(
          "SESOMU GPT error:",
          error
        );

      }


      sendButton.disabled =
        false;

      micButton.disabled =
        false;


      scrollChat();

    }


    sendButton.addEventListener(
      "click",
      sendMessage
    );


    messageInput.addEventListener(
      "keydown",
      event => {

        if (
          event.key === "Enter" &&
          !event.shiftKey
        ) {

          event.preventDefault();

          sendMessage();

        }

      }
    );


    /* =========================
       VOICE INPUT
    ========================= */

    const SpeechRecognition =
      window.SpeechRecognition ||
      window.webkitSpeechRecognition;


    let recognition =
      null;


    if (SpeechRecognition) {

      recognition =
        new SpeechRecognition();


      recognition.continuous =
        false;

      recognition.interimResults =
        true;

      recognition.lang =
        "en-IN";


      recognition.onstart = () => {

        micButton.classList.add(
          "listening"
        );

      };


      recognition.onend = () => {

        micButton.classList.remove(
          "listening"
        );

      };


      recognition.onerror = () => {

        micButton.classList.remove(
          "listening"
        );

      };


      recognition.onresult =
        event => {

          let transcript = "";


          for (
            let i = event.resultIndex;
            i < event.results.length;
            i++
          ) {

            transcript +=
              event.results[i][0]
                .transcript;

          }


          messageInput.value =
            transcript;

        };


      micButton.addEventListener(
        "click",
        () => {

          try {

            recognition.start();

          } catch {

            /*
              Prevent an error if
              recognition is already running.
            */

          }

        }
      );


    } else {

      micButton.addEventListener(
        "click",
        () => {

          alert(
            "Voice input is not supported by this browser."
          );

        }
      );

    }


    /* =========================
       RETURNING USER
    ========================= */

    const savedUser =
      getSavedUser();


    if (savedUser) {

      showApp();

    }


    /* =========================
       SAVE BEFORE LEAVING
    ========================= */

    window.addEventListener(
      "beforeunload",
      () => {

        saveCurrentChat();

      }
    );

  </script>

</body>
</html>
