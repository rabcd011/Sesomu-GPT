<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>SESOMU GPT</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
      background: #05050e;
      color: #ffffff;
    }

    button,
    input {
      font-family: inherit;
    }

    /* =========================
       LOGIN SCREEN
       ========================= */

    #loginScreen {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background:
        radial-gradient(circle at top, rgba(80, 70, 180, 0.18), transparent 40%),
        #05050e;
      z-index: 1000;
      padding: 20px;
    }

    .loginCard {
      width: min(420px, 100%);
      padding: 32px 26px;
      border-radius: 24px;
      background: rgba(18, 18, 35, 0.94);
      border: 1px solid rgba(255, 255, 255, 0.09);
      box-shadow: 0 25px 80px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .loginLogo {
      width: 100px;
      height: 100px;
      object-fit: contain;
      border-radius: 50%;
      margin-bottom: 15px;
    }

    .loginTitle {
      margin: 0 0 8px;
      font-size: 28px;
      font-weight: 700;
    }

    .loginSubtitle {
      margin: 0 0 25px;
      color: #a7a7c2;
      font-size: 14px;
    }

    .loginInput {
      width: 100%;
      height: 48px;
      margin-bottom: 14px;
      padding: 0 15px;
      border-radius: 13px;
      border: 1px solid #30304c;
      background: #0c0c19;
      color: white;
      outline: none;
      font-size: 15px;
    }

    .loginInput:focus {
      border-color: #7070ff;
    }

    #loginButton {
      width: 100%;
      height: 48px;
      border: none;
      border-radius: 13px;
      background: linear-gradient(135deg, #6969ff, #9b62ff);
      color: white;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 5px;
    }

    #loginButton:hover {
      opacity: 0.92;
    }

    /* =========================
       APP
       ========================= */

    #app {
      display: none;
      position: relative;
      width: 100%;
      height: 100%;
    }

    /* =========================
       TOP BAR
       ========================= */

    .topBar {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 54px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 100;
      background: rgba(5, 5, 14, 0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }

    .brandSmall {
      font-weight: 700;
      font-size: 16px;
      letter-spacing: 0.4px;
    }

    .topActions {
      display: flex;
      gap: 8px;
    }

    .smallButton {
      border: 1px solid #30304c;
      background: #10101f;
      color: #d9d9ee;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 12px;
      cursor: pointer;
    }

    .smallButton:hover {
      background: #18182a;
    }

    /* =========================
       LOGO
       ========================= */

    .logoWrap {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -55%);
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      transition: top 0.45s ease, transform 0.45s ease;
      pointer-events: none;
    }

    .logoWrap.chatStarted {
      top: 58px;
      transform: translateX(-50%);
    }

    .logoWrap.chatStarted::before {
      content: "";
      position: absolute;
      left: 50%;
      top: -18px;
      width: 100vw;
      height: 145px;
      transform: translateX(-50%);
      background:
        linear-gradient(
          to bottom,
          rgba(5, 5, 14, 0.99) 0%,
          rgba(5, 5, 14, 0.97) 72%,
          rgba(5, 5, 14, 0.72) 90%,
          rgba(5, 5, 14, 0) 100%
        );
      z-index: -1;
      pointer-events: none;
    }

    .mainLogo {
      width: 115px;
      height: 115px;
      object-fit: contain;
      border-radius: 50%;
    }

    .logoTitle {
      margin-top: 10px;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 0.4px;
    }

    .logoSubtitle {
      margin-top: 5px;
      color: #9292ae;
      font-size: 13px;
    }

    /* =========================
       CHAT
       ========================= */

    #chat {
      position: absolute;
      top: 165px;
      bottom: 112px;
      left: 50%;
      transform: translateX(-50%);
      width: min(900px, calc(100% - 40px));
      padding: 15px 5px 20px;
      overflow-y: auto;
      overscroll-behavior: contain;
      scrollbar-width: thin;
      scrollbar-color: #30304c transparent;
      z-index: 5;
    }

    .messageRow {
      display: flex;
      margin-bottom: 16px;
    }

    .messageRow.user {
      justify-content: flex-end;
    }

    .messageRow.bot {
      justify-content: flex-start;
    }

    .messageBubble {
      max-width: 82%;
      padding: 12px 15px;
      border-radius: 16px;
      line-height: 1.55;
      font-size: 15px;
      overflow-wrap: anywhere;
    }

    .user .messageBubble {
      background: #242444;
      border: 1px solid #37375d;
    }

    .bot .messageBubble {
      background: rgba(14, 14, 28, 0.72);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }

    .messageBubble strong {
      font-weight: 700;
      color: #ffffff;
    }

    .messageBubble em {
      font-style: italic;
    }

    .messageBubble p {
      margin: 0 0 10px;
    }

    .messageBubble p:last-child {
      margin-bottom: 0;
    }

    .messageBubble ul,
    .messageBubble ol {
      margin: 8px 0;
      padding-left: 23px;
    }

    .messageBubble li {
      margin: 4px 0;
    }

    .messageBubble h1,
    .messageBubble h2,
    .messageBubble h3 {
      margin: 10px 0 7px;
      line-height: 1.3;
    }

    .messageBubble h1 {
      font-size: 22px;
    }

    .messageBubble h2 {
      font-size: 19px;
    }

    .messageBubble h3 {
      font-size: 17px;
    }

    .messageBubble code {
      padding: 2px 5px;
      border-radius: 5px;
      background: #171727;
      font-family: monospace;
      font-size: 0.9em;
    }

    .messageBubble pre {
      margin: 10px 0;
      padding: 12px;
      overflow-x: auto;
      border-radius: 10px;
      background: #0a0a13;
      border: 1px solid #28283d;
    }

    .messageBubble pre code {
      padding: 0;
      background: transparent;
    }

    .messageBubble a {
      color: #8b8bff;
      text-decoration: underline;
    }

    .typing {
      opacity: 0.65;
      font-style: italic;
    }

    /* =========================
       INPUT AREA
       ========================= */

    .inputArea {
      position: fixed;
      left: 50%;
      bottom: 48px;
      transform: translateX(-50%);
      width: min(900px, calc(100% - 40px));
      z-index: 50;
    }

    .search {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 7px;
      border-radius: 17px;
      background: rgba(15, 15, 28, 0.97);
      border: 1px solid #30304c;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.35);
    }

    #messageInput {
      flex: 1;
      min-width: 0;
      height: 42px;
      border: none;
      outline: none;
      background: transparent;
      color: white;
      padding: 0 10px;
      font-size: 15px;
    }

    #messageInput::placeholder {
      color: #74748d;
    }

    .actionButton {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      border-radius: 12px;
      border: 1px solid #30304c;
      background: #111121;
      color: #ddddee;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .actionButton:hover {
      background: #1b1b30;
    }

    .actionButton.active {
      border-color: #7777ff;
      background: #242449;
    }

    .micIcon {
      width: 22px;
      height: 28px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .micBody {
      fill: currentColor;
      stroke: none;
    }

    .micLine {
      stroke: #111121;
      stroke-width: 1.3;
    }

    .micBase {
      fill: currentColor;
      stroke: none;
    }

    .grokIcon {
      width: 22px;
      height: 22px;
      fill: none;
      stroke: currentColor;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    #sendButton {
      height: 42px;
      padding: 0 17px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #6969ff, #9b62ff);
      color: white;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    #sendButton:hover {
      opacity: 0.92;
    }

    .hint {
      position: fixed;
      bottom: 14px;
      left: 0;
      width: 100%;
      text-align: center;
      color: #66667d;
      font-size: 11px;
      z-index: 30;
    }

    /* =========================
       RECENT CHATS
       ========================= */

    #recentPanel {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(4px);
    }

    .recentCard {
      position: absolute;
      top: 70px;
      right: 18px;
      width: min(390px, calc(100% - 36px));
      max-height: calc(100vh - 100px);
      overflow-y: auto;
      padding: 18px;
      border-radius: 18px;
      background: #111120;
      border: 1px solid #30304c;
      box-shadow: 0 25px 70px rgba(0, 0, 0, 0.55);
    }

    .recentHeader {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .recentHeader h3 {
      margin: 0;
      font-size: 17px;
    }

    #closeRecent {
      width: 32px;
      height: 32px;
      border-radius: 9px;
      border: 1px solid #30304c;
      background: #181829;
      color: white;
      cursor: pointer;
    }

    .recentItem {
      padding: 12px;
      margin-bottom: 9px;
      border-radius: 12px;
      background: #181829;
      border: 1px solid #292940;
      cursor: pointer;
    }

    .recentItem:hover {
      background: #202039;
    }

    .recentItemTitle {
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 5px;
      color: #eeeeff;
    }

    .recentItemTime {
      font-size: 11px;
      color: #77778e;
    }

    .emptyRecent {
      color: #77778e;
      text-align: center;
      padding: 25px 10px;
      font-size: 13px;
    }

    /* =========================
       MOBILE
       ========================= */

    @media (max-width: 600px) {
      .topBar {
        height: 48px;
        padding: 0 10px;
      }

      .brandSmall {
        font-size: 14px;
      }

      .smallButton {
        padding: 7px 9px;
        font-size: 10px;
      }

      .logoWrap.chatStarted {
        top: 48px;
        transform: translateX(-50%);
      }

      .logoWrap.chatStarted::before {
        top: -12px;
        height: 128px;
      }

      .mainLogo {
        width: 85px;
        height: 85px;
      }

      .logoTitle {
        margin-top: 5px;
        font-size: 21px;
      }

      .logoSubtitle {
        font-size: 11px;
      }

      #chat {
        top: 125px;
        bottom: 76px;
        width: 100%;
        padding: 8px 12px 12px;
        z-index: 5;
      }

      .messageBubble {
        max-width: 91%;
        font-size: 14px;
      }

      .inputArea {
        bottom: 38px;
        width: calc(100% - 16px);
      }

      .search {
        gap: 5px;
        padding: 5px;
      }

      #messageInput {
        font-size: 14px;
        padding: 0 7px;
      }

      #sendButton {
        padding: 0 12px;
        font-size: 12px;
      }

      .actionButton {
        width: 39px;
        height: 39px;
        flex-basis: 39px;
      }

      .hint {
        bottom: 10px;
      }

      .recentCard {
        top: 58px;
        right: 8px;
        width: calc(100% - 16px);
      }
    }
  </style>

</head>

<body>

  <!-- =========================
       LOGIN
       ========================= -->

  <div id="loginScreen">


<div class="loginCard">

  <img

    <button

    </button>

  </div>

</div>


<!-- LOGO -->

<div class="logoWrap" id="logoWrap">

  <img
    src="logo.jpeg"
    alt="SESOMU GPT"
    class="mainLogo"
  >

  <div class="logoTitle">
    SESOMU GPT
  </div>

  <div class="logoSubtitle">

</div>


<!-- CHAT -->

<!-- INPUT -->

<div class="inputArea">

  <div class="search">

    <input

    <!-- GROK WEB SEARCH -->

<!-- RECENT CHATS -->

<div id="recentPanel">

  <div class="recentCard">

    <div class="recentHeader">

      <h3>
        Recent Chats
      </h3>

      <button id="closeRecent">
        ×
      </button>

    </div>

    <div id="recentList"></div>

  </div>

</div>


  </div>

  <script>

    /* =========================
       CONFIG
       ========================= */

    const API_URL =
      "https://sesomu-gpt-api.ghanu-bhai01.workers.dev/";


    /* =========================
       ELEMENTS
       ========================= */

    const loginScreen =
      document.getElementById("loginScreen");

    const app =
      document.getElementById("app");

    const nameInput =
      document.getElementById("nameInput");

    const designationInput =
      document.getElementById("designationInput");

    const loginButton =
      document.getElementById("loginButton");

    const messageInput =
      document.getElementById("messageInput");

    const sendButton =
      document.getElementById("sendButton");

    const micButton =
      document.getElementById("micButton");

    const grokButton =
      document.getElementById("grokButton");

    const chat =
      document.getElementById("chat");

    const logoWrap =
      document.getElementById("logoWrap");

    const newChatButton =
      document.getElementById("newChatButton");

    const recentButton =
      document.getElementById("recentButton");

    const recentPanel =
      document.getElementById("recentPanel");

    const recentList =
      document.getElementById("recentList");

    const closeRecent =
      document.getElementById("closeRecent");


    /* =========================
       USER STORAGE
       ========================= */

    function getSavedUser() {
      try {
        return JSON.parse(
          localStorage.getItem("sesomu_user") || "null"
        );
      } catch {
        return null;
      }
    }

    function saveUser(user) {
      localStorage.setItem(
        "sesomu_user",
        JSON.stringify(user)
      );
    }


    /* =========================
       CHAT STORAGE
       ========================= */

    function getChats() {
      try {
        return JSON.parse(
          localStorage.getItem("sesomu_chats") || "[]"
        );
      } catch {
        return [];
      }
    }

    function saveChats(chats) {
      localStorage.setItem(
        "sesomu_chats",
        JSON.stringify(chats)
      );
    }


    function saveCurrentChat() {

      const messages = [];

      chat.querySelectorAll(".messageRow")
        .forEach(row => {

          const bubble =
            row.querySelector(".messageBubble");

          if (!bubble) return;

          messages.push({
            role: row.classList.contains("user")
              ? "user"
              : "bot",

            text: bubble.textContent || ""
          });

        });

      if (!messages.length) return;

      const firstUser =
        messages.find(m => m.role === "user");

      const title =
        firstUser
          ? firstUser.text.substring(0, 60)
          : "New Chat";

      const chats = getChats();

      chats.unshift({
        id: Date.now(),
        title,
        time: new Date().toLocaleString(),
        messages
      });

      saveChats(chats.slice(0, 30));
    }


    /* =========================
       LOGIN
       ========================= */

    function showApp() {

      loginScreen.style.display = "none";
      app.style.display = "block";

      messageInput.focus();
    }


    function login() {

      const name =
        nameInput.value.trim();

      const designation =
        designationInput.value.trim();

      if (!name) {
        alert("Please enter your name.");
        nameInput.focus();
        return;
      }

      if (!designation) {
        alert("Please enter your designation.");
        designationInput.focus();
        return;
      }

      saveUser({
        name,
        designation
      });

      showApp();
    }


    loginButton.addEventListener(
      "click",
      login
    );


    nameInput.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          designationInput.focus();
        }
      }
    );


    designationInput.addEventListener(
      "keydown",
      event => {
        if (event.key === "Enter") {
          login();
        }
      }
    );


    /* =========================
       NEW CHAT
       ========================= */

    function startNewChat() {

      if (chat.children.length) {
        saveCurrentChat();
      }

      chat.innerHTML = "";

      logoWrap.classList.remove(
        "chatStarted"
      );

      messageInput.value = "";
      messageInput.focus();
    }


    newChatButton.addEventListener(
      "click",
      startNewChat
    );


    /* =========================
       RECENT CHATS
       ========================= */

    function showRecentChats() {

      const chats = getChats();

      recentList.innerHTML = "";

      if (!chats.length) {

        recentList.innerHTML =
          '<div class="emptyRecent">No recent chats yet.</div>';

        recentPanel.style.display = "block";

        return;
      }

      chats.forEach(item => {

        const div =
          document.createElement("div");

        div.className = "recentItem";

        div.innerHTML = `
          <div class="recentItemTitle">
            ${escapeHTML(item.title)}
          </div>

          <div class="recentItemTime">
            ${escapeHTML(item.time)}
          </div>
        `;

        div.addEventListener(
          "click",
          () => loadChat(item)
        );

        recentList.appendChild(div);

      });

      recentPanel.style.display = "block";
    }


    recentButton.addEventListener(
      "click",
      showRecentChats
    );


    closeRecent.addEventListener(
      "click",
      () => {
        recentPanel.style.display = "none";
      }
    );


    recentPanel.addEventListener(
      "click",
      event => {

        if (event.target === recentPanel) {
          recentPanel.style.display = "none";
        }

      }
    );


    function loadChat(savedChat) {

      chat.innerHTML = "";

      savedChat.messages.forEach(
        message => {

          if (message.role === "user") {
            addUserMessage(
              message.text,
              false
            );
          } else {
            addBotMessage(
              message.text,
              false
            );
          }

        }
      );

      logoWrap.classList.add(
        "chatStarted"
      );

      recentPanel.style.display = "none";

      messageInput.focus();
    }


    /* =========================
       SAFE HTML
       ========================= */

    function escapeHTML(text) {

      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }


    /* =========================
       MARKDOWN RENDERER
       ========================= */

    function renderMarkdown(text) {

      let source =
        escapeHTML(String(text || ""));

      const codeBlocks = [];

      source = source.replace(
        /([\s\S]*?)/g,
        function (_, code) {

          const index =
            codeBlocks.length;

          codeBlocks.push(
            "<pre><code>" +
            code.trim() +
            "</code></pre>"


      );

      return `@@CODEBLOCK${index}@@`;
    }
  );


  source = source.replace(
    /`([^`\n]+)`/g,
    "<code>$1</code>"
  );


  source = source.replace(
    /^### (.+)$/gm,
    "<h3>$1</h3>"
  );

  source = source.replace(
    /^## (.+)$/gm,
    "<h2>$1</h2>"
  );

  source = source.replace(
    /^# (.+)$/gm,
    "<h1>$1</h1>"
  );


  source = source.replace(
    /\*\*(.+?)\*\*/g,
    "<strong>$1</strong>"
  );

  source = source.replace(
    /__(.+?)__/g,
    "<strong>$1</strong>"
  );

  source = source.replace(
    /(^|[^*])\*([^*\n]+)\*/g,
    "$1<em>$2</em>"
  );

  source = source.replace(
    /(^|[^_])_([^_\n]+)_/g,
    "$1<em>$2</em>"
  );


  const lines =
    source.split("\n");

  let result = "";
  let inUL = false;
  let inOL = false;

  for (let i = 0; i < lines.length; i++) {

    const line = lines[i];

    const ulMatch =
      line.match(/^\s*[-*+]\s+(.+)$/);

    const olMatch =
      line.match(/^\s*\d+\.\s+(.+)$/);


    if (ulMatch) {

      if (!inUL) {
        result += "<ul>";
        inUL = true;
      }

      result += "<li>" +
        ulMatch[1] +
        "</li>";

      continue;
    }


    if (olMatch) {

      if (!inOL) {
        result += "<ol>";
        inOL = true;
      }

      result += "<li>" +
        olMatch[1] +
        "</li>";

      continue;
    }


    if (inUL) {
      result += "</ul>";
      inUL = false;
    }

    if (inOL) {
      result += "</ol>";
      inOL = false;
    }


    if (!line.trim()) {
      result += "<br>";
    } else if (
      line.startsWith("<h1>") ||
      line.startsWith("<h2>") ||
      line.startsWith("<h3>") ||
      line.startsWith("<pre>")
    ) {
      result += line;
    } else {
      result += "<p>" + line + "</p>";
    }
  }


  if (inUL) result += "</ul>";
  if (inOL) result += "</ol>";


  result = result.replace(
    /@@CODEBLOCK(\d+)@@/g,
    (_, index) =>
      codeBlocks[Number(index)]
  );


  return result;
}


/* =========================
   ADD USER MESSAGE
   ========================= */

function addUserMessage(
  text,
  scroll = true
) {

  const row =
    document.createElement("div");

  row.className =
    "messageRow user";

  const bubble =
    document.createElement("div");

  bubble.className =
    "messageBubble";

  bubble.textContent =
    text;

  row.appendChild(bubble);

  chat.appendChild(row);

  if (scroll) {
    chat.scrollTop =
      chat.scrollHeight;
  }
}


/* =========================
   ADD BOT MESSAGE
   ========================= */

function addBotMessage(
  text,
  scroll = true
) {

  const row =
    document.createElement("div");

  row.className =
    "messageRow bot";

  const bubble =
    document.createElement("div");

  bubble.className =
    "messageBubble";

  bubble.innerHTML =
    renderMarkdown(text);

  row.appendChild(bubble);

  chat.appendChild(row);

  if (scroll) {
    chat.scrollTop =
      chat.scrollHeight;
  }
}


/* =========================
   TYPING MESSAGE
   ========================= */

function addTypingMessage() {

  const row =
    document.createElement("div");

  row.className =
    "messageRow bot";

  const bubble =
    document.createElement("div");

  bubble.className =
    "messageBubble typing";

  bubble.textContent =
    "Thinking...";

  row.appendChild(bubble);

  chat.appendChild(row);

  chat.scrollTop =
    chat.scrollHeight;

  return row;
}


/* =========================
   NORMAL CHAT
   ========================= */

async function sendMessage() {

  const message =
    messageInput.value.trim();

  if (!message) return;

  addUserMessage(message);

  logoWrap.classList.add(
    "chatStarted"
  );

  messageInput.value = "";

  const typing =
    addTypingMessage();

  sendButton.disabled = true;

  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          message
        })

      });


    const data =
      await response.json();


    typing.remove();


    if (!response.ok) {

      addBotMessage(
        data?.answer ||
        "The AI service is temporarily unavailable."
      );

      return;
    }


    addBotMessage(
      data?.answer ||
      "I couldn't generate an answer."
    );


  } catch (error) {

    typing.remove();

    addBotMessage(
      "Unable to connect to SESOMU GPT right now."
    );

  } finally {

    sendButton.disabled =
      false;

    messageInput.focus();

  }
}


sendButton.addEventListener(
  "click",
  sendMessage
);


messageInput.addEventListener(
  "keydown",
  event => {

    if (
      event.key === "Enter" &&
      !event.shiftKey
    ) {
      event.preventDefault();
      sendMessage();
    }

  }
);


/* =========================
   GROK WEB SEARCH
   ========================= */

async function askGrok() {

  const message =
    messageInput.value.trim();

  if (!message) {

    messageInput.focus();

    return;
  }


  addUserMessage(message);

  logoWrap.classList.add(
    "chatStarted"
  );

  messageInput.value = "";

  const typing =
    addTypingMessage();

  grokButton.disabled = true;
  grokButton.classList.add("active");

  try {

    const response =
      await fetch(API_URL, {

        method: "POST",

        headers: {
          "Content-Type":
            "application/json"
        },

        body: JSON.stringify({
          message,
          mode: "grok"
        })

      });


    const data =
      await response.json();


    typing.remove();


    if (!response.ok) {

      addBotMessage(
        data?.answer ||
        "Grok Web Search is unavailable right now."
      );

      return;
    }


    addBotMessage(
      data?.answer ||
      "Grok did not return an answer."
    );


  } catch (error) {

    typing.remove();

    addBotMessage(
      "Unable to connect to Grok Web Search."
    );

  } finally {

    grokButton.disabled =
      false;

    grokButton.classList.remove(
      "active"
    );

    messageInput.focus();

  }
}


grokButton.addEventListener(
  "click",
  askGrok
);


/* =========================
   VOICE INPUT
   ========================= */

let recognition = null;
let isListening = false;

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if (SpeechRecognition) {

  recognition =
    new SpeechRecognition();

  recognition.continuous = false;
  recognition.interimResults = true;
  recognition.lang = "en-IN";


  recognition.onstart =
    () => {

      isListening = true;

      micButton.classList.add(
        "active"
      );

    };


  recognition.onresult =
    event => {

      let transcript = "";

      for (
        let i = event.resultIndex;
        i < event.results.length;
        i++
      ) {

        transcript +=
          event.results[i][0].transcript;

      }

      messageInput.value =
        transcript.trim();

    };


  recognition.onend =
    () => {

      isListening = false;

      micButton.classList.remove(
        "active"
      );

    };


  recognition.onerror =
    () => {

      isListening = false;

      micButton.classList.remove(
        "active"
      );

    };


  micButton.addEventListener(
    "click",
    () => {

      if (isListening) {

        recognition.stop();

      } else {

        recognition.start();

      }

    }
  );

} else {

  micButton.addEventListener(
    "click",
    () => {

      alert(
        "Voice input is not supported in this browser."
      );

    }
  );

}


/* =========================
   STARTUP
   ========================= */

const savedUser =
  getSavedUser();


if (savedUser) {

  nameInput.value =
    savedUser.name || "";

  designationInput.value =
    savedUser.designation || "";

  showApp();

} else {

  loginScreen.style.display =
    "flex";

  app.style.display =
    "none";

}

  </script>
